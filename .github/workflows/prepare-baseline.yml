name: Prepare baseline data and lockfile
on:
  push:
    branches: ['feat/mp2-baseline']
    paths: ['package.json', 'scripts/update-collection.mjs', '.github/workflows/prepare-baseline.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and verify npm dependencies
        run: npm install
      - name: Save a real API snapshot for outage fallback
        run: npm run data:refresh
      - name: Commit generated files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/data/collection.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock dependencies and save museum API snapshot'
            git push origin HEAD:${{ github.ref_name }}
          fi
