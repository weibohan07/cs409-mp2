name: Validate MP2 baseline
on:
  push:
    branches: ['feat/mp2-baseline']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package the exact source revision
        run: git archive --format=zip -o cabinet-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-source-and-build
          path: |
            cabinet-source.zip
            dist/
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
