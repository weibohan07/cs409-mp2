name: Diagnose museum images
on:
  push:
    branches: ['feat/mp2-baseline']
    paths: ['scripts/probe-images.mjs', '.github/workflows/probe-images.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe-images.mjs
